[package]
name = "glossa"
version = "1.3.0" # x-release-please-version
description = "Multi-stage AI translation pipeline for scholars"
authors = ["Niki Corradetti"]
license = "GPL-3.0-or-later"
repository = "https://github.com/nikazzio/glossa"
edition = "2021"
rust-version = "1.80.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "glossa_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
bytes = "1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
log = "0.4"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "json", "migrate"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
reqwest = { version = "0.12", features = ["json", "cookies"] }
# Puro Rust: nessuna libreria di sistema da installare, quindi le build per
# Windows, macOS e Linux restano come sono. Solo i formati che servono davvero:
# le biblioteche IIIF servono JPEG, e la PNG è l'unica altra che capiti.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Ridimensionamento con le istruzioni vettoriali del processore: stesso
# risultato del filtro Lanczos già in uso, diverse volte più veloce. Puro
# Rust anche questa: nessuna libreria di sistema in più da compilare.
fast_image_resize = { version = "6", features = ["image"] }
url = "2"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# `rt` serve a `spawn_blocking`: ricavare una miniatura è lavoro del
# processore, e dentro il filo del runtime terrebbe ferma tutta la coda.
tokio = { version = "1", features = ["sync", "macros", "time", "rt"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
pdf-extract = "0.12"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.6"
thiserror = "1"
schemars = { version = "0.8", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
wiremock = "0.6"

[profile.dev]
debug = 1
incremental = true

[profile.release]
opt-level = "z"      # ottimizza per dimensione (binario più piccolo = installer più leggero)
lto = "thin"         # "thin" = buon risparmio, build CI veloce; valutare "true" (full LTO, -3–8% binario) dopo aver misurato i tempi sui runner CI
codegen-units = 1    # un solo codegen unit per massimizzare le ottimizzazioni del linker
strip = "symbols"    # rimuove simboli da ELF/Mach-O; su MSVC i simboli sono in PDB separati (non inclusi nel bundle), quindi l'effetto su Windows è già garantito dalla pipeline di build
